name: Generate BDO worker empire

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Dashboard optimisation job ID
        required: true
        type: string

concurrency:
  group: bdo-empire-optimizer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DASHBOARD_URL: https://bdo-worker-empire.mite-suaver0v.chatgpt.site
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optimiser
        run: pip install bdo-empire==0.8.2
      - name: Solve empire
        env:
          BDO_SITES_API_TOKEN: ${{ secrets.BDO_SITES_API_TOKEN }}
        run: python runner.py
      - name: Preserve result for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimized-empire-${{ env.JOB_ID }}
          path: optimized_empire.json
          if-no-files-found: ignore
          retention-days: 7
